name: Build Admin APK

# Build Android APK dari PWA admin panel menggunakan Bubblewrap (TWA).
# APK bisa di-install di Android langsung (sideload) atau di-upload ke Play Store.
#
# Trigger:
# - Manual: dari Actions tab → "Run workflow"
# - Auto: setiap tag v* (mis. v1.0.0)
#
# Output:
# - app-release-signed.apk (signed, siap install/distribusi)
# - SHA256 fingerprint (untuk update assetlinks.json)
# - Di-upload sebagai artifact (download dari Actions tab)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL production website (default: mdta-tawangsari.vercel.app)"
        required: true
        default: "https://mdta-tawangsari.vercel.app"
      app_name:
        description: "Nama aplikasi (default: MDTA Admin)"
        required: true
        default: "MDTA Admin"
      app_version:
        description: "Versi APK (default: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (required by Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📱 Verify Android SDK (pre-installed on ubuntu-latest)
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/cmdline-tools/ 2>/dev/null || echo "No cmdline-tools"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"
          # Accept licenses if not already accepted
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ Android SDK ready"

      - name: 🔧 Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 📝 Determine inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag trigger (v1.0.0)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "site_url=https://mdta-tawangsari.vercel.app" >> $GITHUB_OUTPUT
            echo "app_name=MDTA Admin" >> $GITHUB_OUTPUT
            echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Manual trigger
            echo "site_url=${{ github.event.inputs.site_url }}" >> $GITHUB_OUTPUT
            echo "app_name=${{ github.event.inputs.app_name }}" >> $GITHUB_OUTPUT
            echo "app_version=${{ github.event.inputs.app_version }}" >> $GITHUB_OUTPUT
          fi
          # Compute version code (integers only from version string)
          VERSION="${{ github.event.inputs.app_version || '1.0.0' }}"
          VERSION_CODE=$(echo "$VERSION" | tr -cd '[:digit:]')
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -lt 1 ]; then VERSION_CODE=1; fi
          echo "app_version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: 🏗️ Create TWA manifest manually
        run: |
          # Create twa-manifest.json using python (avoids heredoc indentation issues)
          python3 -c "
          import json
          manifest = {
            'packageId': 'id.sch.mdta.miftahululum01.admin',
            'host': 'mdta-tawangsari.vercel.app',
            'name': '${{ steps.inputs.outputs.app_name }}',
            'themeColor': '#003527',
            'navigationColor': '#003527',
            'navigationColorDark': '#003527',
            'navigationDividerColor': '#003527',
            'navigationDividerColorDark': '#003527',
            'backgroundColor': '#003527',
            'enableNotifications': True,
            'startUrl': '/admin',
            'iconUrl': 'https://mdta-tawangsari.vercel.app/icons/admin/icon-512.png',
            'maskableIconUrl': 'https://mdta-tawangsari.vercel.app/icons/admin/icon-512-maskable.png',
            'splashScreenFadeOutDuration': 300,
            'signingKey': {'path': 'android.keystore', 'alias': 'mdta-admin'},
            'appVersionName': '${{ steps.inputs.outputs.app_version }}',
            'appVersionCode': ${{ steps.inputs.outputs.app_version_code }},
            'shortcuts': [
              {'name': 'Dashboard', 'shortName': 'Dashboard', 'url': '/admin'},
              {'name': 'Kelola Berita', 'shortName': 'Berita', 'url': '/admin#news'},
              {'name': 'Push Notifikasi', 'shortName': 'Push Notif', 'url': '/admin#push-notif'},
              {'name': 'Pengaturan', 'shortName': 'Settings', 'url': '/admin#settings'}
            ],
            'generatorApp': 'bubblewrap-cli',
            'webManifestUrl': 'https://mdta-tawangsari.vercel.app/admin-manifest.webmanifest',
            'fallbackType': 'customtabs',
            'features': {
              'locationDelegation': {'enabled': False},
              'playBilling': {'enabled': False}
            },
            'alphaDependencies': {'enabled': False},
            'enableSiteSettingsShortcut': False,
            'isChromeOSOnly': False,
            'isMetaQuest': False,
            'fullScopeUrl': 'https://mdta-tawangsari.vercel.app/admin/',
            'minLinksQuality': 1
          }
          with open('twa-manifest.json', 'w') as f:
            json.dump(manifest, f, indent=2)
          print('✅ Created twa-manifest.json')
          "
          cat twa-manifest.json | head -20

      - name: 🏗️ Generate signing keystore
        run: |
          # Generate signing keystore BEFORE bubblewrap update (so it's detected)
          if [ ! -f android.keystore ]; then
            keytool -genkeypair \
              -keystore android.keystore \
              -alias mdta-admin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mdta-admin-2025 \
              -keypass mdta-admin-2025 \
              -dname "CN=MDTA Miftahul Ulum 01, OU=Admin, O=MDTA, L=Tangerang, ST=Banten, C=ID"
            echo "✅ Generated signing keystore"
          else
            echo "✅ Keystore already exists"
          fi

      - name: 📱 Generate Android project (bubblewrap update)
        run: |
          # bubblewrap update generates the Android project (gradle, java files)
          # from twa-manifest.json. This step is REQUIRED before build.
          #
          # Bubblewrap asks 2 interactive prompts even with --no-interactive:
          # 1. "Do you want Bubblewrap to install the JDK? (Y/n)" → answer "n"
          # 2. "Path to your existing JDK 17:" → answer $JAVA_HOME
          #
          # We pipe both answers via printf.
          printf "n\n$JAVA_HOME\n" | bubblewrap update --no-interactive || {
            echo "❌ bubblewrap update failed with piped input"
            echo "Trying with JDK_PATH env var..."
            export BUBBLEWRAP_JDK_PATH="$JAVA_HOME"
            bubblewrap update --no-interactive || {
              echo "❌ Still failed. Dumping twa-manifest.json for debug:"
              cat twa-manifest.json
              exit 1
            }
          }

          echo "--- Android project files ---"
          ls -la
          echo ""
          echo "--- gradlew exists? ---"
          ls -la gradlew 2>/dev/null || echo "no gradlew"
          echo ""
          echo "--- app/src ---"
          find app/src -type f 2>/dev/null | head -20 || echo "no app/src"

      - name: 🔨 Build signed release APK
        run: |
          # Build the APK using gradle directly (more reliable than bubblewrap build)
          # bubblewrap build wraps gradle but has interactive prompts we can't answer
          echo "Building APK via Gradle..."

          # Make gradlew executable
          chmod +x ./gradlew 2>/dev/null || true

          # Build release APK
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace || {
            echo "❌ Release build failed, trying debug build..."
            ./gradlew assembleDebug --no-daemon -x lint || {
              echo "❌ Debug build also failed"
              exit 1
            }
          }

      - name: 📋 List build output
        run: |
          echo "--- Looking for APK files ---"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "Found: $apk"
            ls -la "$apk"
            du -h "$apk"
          done
          echo ""
          echo "--- All build outputs ---"
          find . -path "*/build/outputs/apk/*" -type f 2>/dev/null | head -10

      - name: 🔐 Compute SHA256 fingerprint
        id: sha
        run: |
          if [ -f android.keystore ]; then
            SHA256=$(keytool -list -v -keystore android.keystore -storepass mdta-admin-2025 -alias mdta-admin | grep "SHA256:" | head -1 | awk '{print $2}')
            echo "SHA256 fingerprint: $SHA256"
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          else
            echo "sha256=PLACEHOLDER" >> $GITHUB_OUTPUT
          fi

      - name: 🔄 Update assetlinks.json with SHA256
        if: steps.sha.outputs.sha256 != 'PLACEHOLDER'
        run: |
          SHA256="${{ steps.sha.outputs.sha256 }}"
          echo "Updating assetlinks.json with SHA256: $SHA256"

          # Update the assetlinks.json file
          cat > public/.well-known/assetlinks.json << EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "id.sch.mdta.miftahululum01.admin",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]
          EOF

          echo "Updated assetlinks.json:"
          cat public/.well-known/assetlinks.json

      - name: 💾 Commit updated assetlinks.json
        if: steps.sha.outputs.sha256 != 'PLACEHOLDER'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          git commit -m "chore: update assetlinks.json with SHA256 fingerprint for APK signing" || echo "Nothing to commit"
          git push

      - name: 📦 Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdta-admin-apk-${{ steps.inputs.outputs.app_version }}
          path: |
            **/*.apk
            twa-manifest.json
            android.keystore
          retention-days: 90
          if-no-files-found: warn

      - name: 📊 Generate build summary
        if: always()
        run: |
          echo "## 📱 APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ${{ steps.inputs.outputs.app_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.inputs.outputs.app_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** \`id.sch.mdta.miftahululum01.admin\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL:** ${{ steps.inputs.outputs.site_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256 Fingerprint:** \`${{ steps.sha.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download APK" >> $GITHUB_STEP_SUMMARY
          echo "APK file dapat di-download dari **Artifacts** section di atas (klik artifact \`mdta-admin-apk-${{ steps.inputs.outputs.app_version }}\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Install di Android" >> $GITHUB_STEP_SUMMARY
          echo "1. Download file \`app-release-signed.apk\` dari artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer ke HP Android (USB / Drive / dll)" >> $GITHUB_STEP_SUMMARY
          echo "3. Buka file APK di Android → **Settings → Allow from this source**" >> $GITHUB_STEP_SUMMARY
          echo "4. Install → buka app **MDTA Admin**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Update assetlinks.json (sudah otomatis)" >> $GITHUB_STEP_SUMMARY
          echo "SHA256 fingerprint sudah di-commit ke \`public/.well-known/assetlinks.json\`." >> $GITHUB_STEP_SUMMARY
          echo "Tunggu Vercel deploy (~1 menit) supaya APK bisa koneksi ke admin panel tanpa address bar." >> $GITHUB_STEP_SUMMARY
