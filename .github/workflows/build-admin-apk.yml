name: Build Admin APK

# Build Android APK dari pre-generated TWA project template di /android.
# Tidak pakai Bubblewrap CLI (yang problematic di CI) — hanya gradle build murni.
#
# Trigger:
# - Manual: Actions tab → "Run workflow"
# - Auto: push tag v* (mis. v1.0.0)
#
# Output:
# - app-release.apk atau app-debug.apk (signed, siap install)
# - SHA256 fingerprint (untuk assetlinks.json)
# - Di-upload sebagai artifact (download dari Actions tab)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Versi APK (default: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📝 Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.app_version }}"
          fi
          # Version code = digits only (1.0.0 → 100)
          VC=$(echo "$VERSION" | tr -cd '[:digit:]')
          if [ -z "$VC" ] || [ "$VC" -lt 1 ]; then VC=1; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION (code: $VC)"

      - name: ⚙️ Setup Android SDK path
        run: |
          # Write local.properties (needed by gradle to find Android SDK)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "✅ local.properties written:"
          cat android/local.properties

      - name: 🔑 Generate signing keystore
        run: |
          cd android
          if [ ! -f admin.keystore ]; then
            keytool -genkeypair \
              -keystore admin.keystore \
              -alias mdta-admin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mdta-admin-2025 \
              -keypass mdta-admin-2025 \
              -dname "CN=MDTA Miftahul Ulum 01, OU=Admin, O=MDTA, L=Tangerang, ST=Banten, C=ID"
            echo "✅ Generated signing keystore"
          fi

      - name: 🔨 Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: admin.keystore
          KEYSTORE_PASSWORD: mdta-admin-2025
          KEY_ALIAS: mdta-admin
          KEY_PASSWORD: mdta-admin-2025
        run: |
          # Use system gradle (pre-installed on ubuntu-latest)
          gradle assembleRelease \
            -PappVersionCode=${{ steps.ver.outputs.code }} \
            -PappVersionName=${{ steps.ver.outputs.version }} \
            --no-daemon \
            -x lint \
            --stacktrace 2>&1 || {
            echo "❌ Release build failed, trying debug..."
            gradle assembleDebug \
              -PappVersionCode=${{ steps.ver.outputs.code }} \
              -PappVersionName=${{ steps.ver.outputs.version }} \
              --no-daemon \
              -x lint 2>&1 || {
              echo "❌ Both release and debug builds failed"
              exit 1
            }
          }

      - name: 📋 List APK files
        run: |
          echo "=== APK files ==="
          find android -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "📦 $apk"
            ls -la "$apk"
            du -h "$apk"
          done

      - name: 🔐 Compute SHA256 fingerprint
        id: sha
        run: |
          cd android
          SHA256=$(keytool -list -v -keystore admin.keystore -storepass mdta-admin-2025 -alias mdta-admin | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "SHA256: $SHA256"
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: 🔄 Update assetlinks.json
        run: |
          SHA256="${{ steps.sha.outputs.sha256 }}"
          cat > public/.well-known/assetlinks.json << EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "id.sch.mdta.miftahululum01.admin",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]
          EOF
          echo "✅ Updated assetlinks.json with SHA256: $SHA256"
          cat public/.well-known/assetlinks.json

      - name: 💾 Commit assetlinks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/.well-known/assetlinks.json
          git commit -m "chore: update assetlinks.json SHA256 for v${{ steps.ver.outputs.version }}" || echo "Nothing to commit"
          git push || echo "Push skipped (no changes)"

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdta-admin-apk-${{ steps.ver.outputs.version }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/admin.keystore
          retention-days: 90
          if-no-files-found: error

      - name: 📊 Build summary
        if: always()
        run: |
          echo "## 📱 APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.ver.outputs.version }} (code: ${{ steps.ver.outputs.code }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** \`id.sch.mdta.miftahululum01.admin\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256:** \`${{ steps.sha.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "Download artifact \`mdta-admin-apk-${{ steps.ver.outputs.version }}\` dari Artifacts section di atas." >> $GITHUB_STEP_SUMMARY
          echo "Extract ZIP → cari file `app-release.apk` (atau `app-debug.apk`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Install" >> $GITHUB_STEP_SUMMARY
          echo "1. Transfer APK ke HP Android" >> $GITHUB_STEP_SUMMARY
          echo "2. Buka APK → **Allow from this source**" >> $GITHUB_STEP_SUMMARY
          echo "3. Install → buka **MDTA Admin**" >> $GITHUB_STEP_SUMMARY
          echo "4. Login: \`mdta01\` / \`mdta@01\`" >> $GITHUB_STEP_SUMMARY
