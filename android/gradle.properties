# ---------------------------------------------------------------------------
# Project-wide Gradle settings for the MDTA Admin TWA.
# ---------------------------------------------------------------------------

# --- AndroidX (required by androidbrowserhelper 2.5.0) ---
android.useAndroidX=true
android.enableJetifier=false

# --- Gradle performance ---
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for maximum compatibility with AGP 8.5 +
# the androidbrowserhelper library and various CI environments.
org.gradle.configuration-cache=false

# --- Android resource / build settings ---
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.defaults.buildfeatures.buildconfig=false
